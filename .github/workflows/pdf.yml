name: PDF build

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/manuscript.tex"
      - "paper/references.bib"
      - ".github/workflows/pdf.yml"

permissions:
  contents: read

jobs:
  build:
    name: Rebuild manuscript PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the audited manuscript source
        run: test -s paper/manuscript.tex
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: manuscript.tex
          working_directory: paper
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Reject unresolved references and layout warnings
        run: |
          test -f paper/manuscript.log
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined|multiply defined|Overfull \\hbox|Overfull \\vbox|Underfull \\hbox|Underfull \\vbox|^!' paper/manuscript.log; then
            exit 1
          fi
